[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isthisai"
version = "0.1.0"
description = "Uncanny Atlas: how people detect AI-generated images on r/isthisAI and r/RealOrAI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ryan B" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "responses>=0.24"]
llm = ["openai>=1.0"]
import = ["zstandard>=0.22"]

[project.scripts]
isthisai-collect = "isthisai.collect:main"
isthisai-stats = "isthisai.stats:main"
isthisai-enrich = "isthisai.enrich:main"
isthisai-import = "isthisai.import_data:main"
isthisai-extract = "isthisai.extract:main"
isthisai-embed = "isthisai.embed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isthisai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]